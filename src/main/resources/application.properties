spring.application.name=pedidos360-consumer
server.port=8889

# --- PostgreSQL: auditoria_db ---
spring.datasource.url=jdbc:postgresql://localhost:5432/auditoria_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# ACK manual para control explícito del ciclo de vida de los mensajes
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Sin reintentos automáticos de Spring; los reintentos locales se gestionan en el consumer
spring.rabbitmq.listener.simple.retry.enabled=false

# Logging
logging.level.com.pedidos360.consumer=INFO
logging.level.org.springframework.amqp=WARN

